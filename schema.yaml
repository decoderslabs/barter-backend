  /api/offers/:
    get:
      operationId: offers_list
      parameters:
      - in: query
        name: currency
        schema:
          type: string
          default: INR
          enum:
          - AED
          - INR
          - USD
        description: |-
          * `INR` - Indian Rupee
          * `AED` - UAE Dirham
          * `USD` - US Dollar
      - in: query
        name: exclusivity
        schema:
          type: string
          default: none
          enum:
          - category_30
          - full_60
          - none
        description: |-
          * `none` - None
          * `category_30` - Category 30 Days
          * `full_60` - Full 60 Days
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: rights_tier
        schema:
          type: string
          default: none
          enum:
          - buyout
          - extended
          - none
          - standard
        description: |-
          * `none` - None
          * `standard` - Standard
          * `extended` - Extended
          * `buyout` - Buyout
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          default: draft
          enum:
          - closed
          - draft
          - live
          - paused
        description: |-
          * `draft` - Draft
          * `live` - Live
          * `paused` - Paused
          * `closed` - Closed
      - in: query
        name: type
        schema:
          type: string
          enum:
          - course
          - event_pass
          - experience
          - gift_card
          - merchandise
          - physical
          - saas
        description: |-
          * `saas` - SaaS
          * `physical` - Physical Product
          * `event_pass` - Event Pass
          * `experience` - Experience
          * `merchandise` - Merchandise
          * `course` - Course
          * `gift_card` - Gift Card
      tags:
      - offers
      security:
      - jwtAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOfferListList'
          description: ''
    post:
