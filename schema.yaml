components:
  schemas:
    ApprovalModeEnum:
      enum:
      - auto
      - manual
      type: string
      description: |-
        * `auto` - Auto
        * `manual` - Manual
    BrandProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        company_name:
          type: string
          maxLength: 200
        website:
          type: string
          format: uri
          maxLength: 200
        industry:
          type: string
          maxLength: 100
        logo_url:
          type: string
          format: uri
          maxLength: 200
        domain_verified:
          type: boolean
          default: false
      required:
      - company_name
      - id
    BrandProfileRequest:
      type: object
      properties:
        company_name:
          type: string
          minLength: 1
          maxLength: 200
        website:
          type: string
          format: uri
          maxLength: 200
        industry:
          type: string
          maxLength: 100
        logo_url:
          type: string
          format: uri
          maxLength: 200
        domain_verified:
          type: boolean
          default: false
      required:
      - company_name
    CreatorProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        niches: {}
        content_types: {}
        tier:
          allOf:
          - $ref: '#/components/schemas/TierEnum'
          default: nano
      required:
      - id
    CreatorProfileRequest:
      type: object
      properties:
        niches: {}
        content_types: {}
        tier:
          allOf:
          - $ref: '#/components/schemas/TierEnum'
          default: nano
    CurrencyEnum:
      enum:
      - INR
      - AED
      - USD
      type: string
      description: |-
        * `INR` - Indian Rupee
        * `AED` - UAE Dirham
        * `USD` - US Dollar
    Deal:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        offer:
          type: string
          format: uuid
        offer_title:
          type: string
          readOnly: true
        offer_type:
          type: string
          readOnly: true
        brand:
          type: string
          format: uuid
        brand_username:
          type: string
          readOnly: true
        brand_name:
          type: string
          readOnly: true
        creator:
          type: string
          format: uuid
        creator_username:
          type: string
          readOnly: true
        creator_name:
          type: string
          readOnly: true
        agreed_terms: {}
        rights_tier:
          type: string
          maxLength: 20
        raw_files_required:
          type: boolean
          default: false
        exclusivity:
          type: string
          maxLength: 20
        deal_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        currency:
          type: string
          maxLength: 3
        status:
          allOf:
          - $ref: '#/components/schemas/Status631Enum'
          default: pending_membership
        shipping_address:
          type: string
          readOnly: true
        shipped_at:
          type: string
          format: date-time
          nullable: true
        delivered_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        deadline:
          type: string
          format: date
        contract_url:
          type: string
          format: uri
          maxLength: 200
        latest_delivery:
          type: string
          readOnly: true
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/RevisionRequest'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - brand
      - brand_name
      - brand_username
      - created_at
      - creator
      - creator_name
      - creator_username
      - currency
      - deadline
      - deal_fee
      - exclusivity
      - id
      - latest_delivery
      - offer
      - offer_title
      - offer_type
      - revisions
      - rights_tier
      - shipping_address
      - updated_at
    DealList:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        offer_title:
          type: string
          readOnly: true
        brand_username:
          type: string
          readOnly: true
        creator_username:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/Status631Enum'
          default: pending_membership
        deal_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        currency:
          type: string
          maxLength: 3
        deadline:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - brand_username
      - created_at
      - creator_username
      - currency
      - deadline
      - deal_fee
      - id
      - offer_title
    DealMessage:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        sender:
          type: string
          format: uuid
        sender_username:
          type: string
          readOnly: true
        sender_name:
          type: string
          readOnly: true
        body:
          type: string
        attachment_url:
          type: string
          format: uri
          maxLength: 200
        created_at:
          type: string
          format: date-time
          readOnly: true
        read_at:
          type: string
          format: date-time
          nullable: true
        is_read:
          type: string
          readOnly: true
      required:
      - body
      - created_at
      - id
      - is_read
      - sender
      - sender_name
      - sender_username
    DealMessageCreate:
      type: object
      properties:
        body:
          type: string
        attachment_url:
          type: string
          format: uri
          maxLength: 200
      required:
      - body
    DealMessageCreateRequest:
      type: object
      properties:
        body:
          type: string
          minLength: 1
        attachment_url:
          type: string
          format: uri
          maxLength: 200
      required:
      - body
    DropsApplication:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        campaign:
          type: string
          format: uuid
        campaign_name:
          type: string
          readOnly: true
        creator:
          type: string
          format: uuid
        creator_username:
